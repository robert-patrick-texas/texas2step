<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A template: the server fills in the path prefix it is published under (e.g.
         /texas2step/), its version, the default theme and the site's branding, including
         the "t2s:" slot comments below; it writes the footer itself. See
         src/texas2step/page.py. -->
    <base href="/" />
    <meta name="texas2step-version" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>texas2step</title>
    <meta name="description" content="Throughput, latency, jitter and packet loss between you and this server." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/app.css?v=b9a302d7a4" />
    <script>
      // Apply the visitor's theme (or the site default) and page size before first paint,
      // where the site offers their pickers. A site that shows the access code screen alone
      // hides the header and footer now, unless a pass is held, so they don't flash.
      (() => {
        const root = document.documentElement;
        let theme = root.dataset.defaultTheme;
        let size = "";
        let held = false;
        try {
          if (!("fixedTheme" in root.dataset)) theme = localStorage.getItem("t2s.theme") || theme;
          if (!("fixedSize" in root.dataset)) size = localStorage.getItem("t2s.size") || "";
          const pass = JSON.parse(localStorage.getItem("t2s.pass") || "{}");
          held = !!pass.pass && pass.expires * 1000 > Date.now();
        } catch {}
        if (/^(light|dark|federal|texas|america|energy|military)$/.test(theme || "")) root.dataset.theme = theme;
        if (/^(0\.[789]|1\.1|1\.25)$/.test(size)) root.style.setProperty("--ui-zoom", size);
        if ("cardOnly" in root.dataset && !held) root.classList.add("gated");
      })();
    </script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <!--t2s:notice-->
    <header class="topbar">
      <a class="brand" href="./" data-link aria-label="texas2step home">
        <!--t2s:mark-->
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" class="bm-1" />
              <stop offset=".55" class="bm-2" />
              <stop offset="1" class="bm-3" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#bm)" class="bm-tile" />
          <path d="M16 6.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z" class="bm-star" />
        </svg>
        <!--/t2s:mark-->
        <!--t2s:name--><span class="brand-word">texas<em>2</em>step</span><!--/t2s:name-->
      </a>
      <!--t2s:org-->
      <nav class="tabs" aria-label="Sections">
        <a href="./" data-link data-page="test">Test</a>
        <a href="monitor" data-link data-page="monitor">Monitor</a>
        <a href="diag" data-link data-page="diag">Diag</a>
        <a href="history" data-link data-page="history">History</a>
        <a href="help" data-link data-page="help" aria-label="Help" title="Help">?</a>
        <a href="api" data-link data-page="api">API</a>
      </nav>
      <div class="topbar-actions">
        <!--t2s:links-->
        <div class="server-picker" id="server-picker"></div>
        <div id="family-picker"></div>
        <!--t2s:size--><div id="size-picker"></div><!--/t2s:size-->
        <!--t2s:theme--><div class="theme-menu" id="theme-menu"></div><!--/t2s:theme-->
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <!--t2s:footer-->
    <footer class="footer">
      <a id="footer-version" href="https://robert-patrick-texas.github.io/texas2step/" target="_blank" rel="noopener">texas2step</a>
      <span class="dot" aria-hidden="true">·</span>
      <span class="footer-tagline">Measurements run in your browser against the selected server</span>
    </footer>
    <!--/t2s:footer-->
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <noscript><p class="noscript">This page needs JavaScript to run measurements.</p></noscript>
    <script type="module" src="assets/app.js?v=d0c4173560"></script>
  </body>
</html>
