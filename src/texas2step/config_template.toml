# texas2step settings: /etc/texas2step/config.toml
# Every key is optional; the commented values are the defaults. Any key can also be
# set as an environment variable TEXAS2STEP_<KEY> (upper case).
# After a change: sudo systemctl restart texas2step
# Reference: https://github.com/robert-patrick-texas/texas2step/blob/main/docs/configuration.md

# --- Identity ----------------------------------------------------------------------
# server_id = "local"                   # short id stored with results, e.g. "dallas"
# server_name = "texas2step"            # shown in the header and results
# server_location = ""                  # free text, e.g. "Dallas, TX"
# server_url_v4 = ""                    # IPv4-only base URL (enables the IPv4/IPv6 switch)
# server_url_v6 = ""                    # IPv6-only base URL
# server_url_v4_http1 = ""              # IPv4-only base URL serving only HTTP/1.1 (Diag's HTTP/1.1 row)
# server_url_v4_http3 = ""              # IPv4-only base URL that offers HTTP/3 (Diag's HTTP/3 row)
# server_url_v6_http1 = ""              # the same, IPv6-only
# server_url_v6_http3 = ""

# --- Limits --------------------------------------------------------------------------
# download_documents = true             # downloads start with five founding documents as
#                                       # text; false: random from the first byte
# max_download_bytes = 1073741824
# max_upload_bytes = 1073741824
# max_stream_seconds = 60.0
# session_max_runtime = 0               # seconds a UDP or WebSocket session may last; 0 = no limit

# --- UDP probe (WebRTC) ----------------------------------------------------------------
# webrtc_enabled = true
# ice_servers = []                      # e.g. ["stun:stun.example.net:3478"]; none = host candidates only
# max_rtc_sessions = 32                 # per worker
# rtc_session_timeout = 120.0
# rtc_port_min = 0                      # pin the probe's UDP ports so the firewall can
# rtc_port_max = 0                      # allow just that range, e.g. 61000 and 61999

# --- Result history --------------------------------------------------------------------
# results_enabled = true
results_path = "/var/lib/texas2step/results.db"
# results_max_rows = 10000

# --- Server-side measurement (/api/v1/measure/*) ---------------------------------------
# measure_enabled = true
# allow_any_target = false              # true = any URL, not just [[locations]]

# --- Pages of the web UI: hide any, but not all (the API behind them stays) ----------------
# page_test = true                      # the Test tab
# page_monitor = true                   # the Monitor tab
# page_diag = true                      # the Diag tab
# page_history = true                   # the History tab
# page_help = true                      # the ? tab: what each page does, for anyone
# page_api = true                       # the API tab
# page_monitor_max_runtime = 0          # seconds Monitor runs before it stops; 0 = no limit
# page_diag_max_runtime = 0             # seconds Diag runs before it stops; 0 = no limit

# --- Defaults offered to the browser UI --------------------------------------------------
# default_streams = 4
# default_seconds = 10.0
# default_packets = 500
# default_one_stream = true             # one stream's download after the download; up to
#                                       # half again a test's traffic, so false where billed
# monitor_profile = "path"              # Monitor until a visitor picks: path, voice or video
# monitor_voice = true                  # offer Monitor's Voice call profile (about 150 kb/s
#                                       # each way while a tab runs it)
# monitor_video = true                  # offer Monitor's Video call profile (about 1.4 Mb/s
#                                       # each way, counted toward a traffic limit)

# --- HTTP ----------------------------------------------------------------------------------
# cors_origins = ["*"]
# trusted_proxies = ["127.0.0.1", "::1"]  # peers whose X-Forwarded-* headers are believed

# --- Logging (journalctl -u texas2step) ----------------------------------------------------
# debug = false                         # true = also every request and WebRTC detail; very verbose

# --- Updates (sudo texas2step update) ------------------------------------------------------
# Where releases are found: GitHub's API for the project, or an internal mirror of it.
# update_url = "https://api.github.com/repos/robert-patrick-texas/texas2step"
# update_proxy = ""                     # a proxy for its downloads, e.g. "http://proxy.example.net:3128"
# Unattended updates are off until you turn on their timer: docs/install.md (Upgrade).

# --- Access codes, for servers open to the Internet (docs/access.md) -----------------------
# access_code = "off"                   # or how often the code changes: daily, weekly, monthly, fixed
# access_timezone = "America/New_York"  # when daily, weekly and monthly codes change
# access_words = ""                     # your own list, e.g. "/etc/texas2step/access-words.txt"
# access_digits = 2                     # digits at the end of a code: 2, 3 or 4
# access_pass_hours = 12.0              # how long a pass lasts from when it was issued
# access_note = "Contact the service desk for assistance."  # under the code box; "" for none
# access_card_only = false              # true: the code screen shows the code box and
#                                       # brand_notice alone, no header or footer
# access_key_file = "/etc/texas2step/access.key"  # copy the same key to every server
# access_phrases_file = "/etc/texas2step/access-phrases.toml"  # standing phrases:
#                                       # sudo texas2step access phrase add vip
# access_lockout_after = 3              # wrong codes in a row that lock out a /24 or /48
# access_lockout_minutes = 30           # until this long passes with no code from it
# access_lockouts_file = "/var/lib/texas2step/access.db"  # sudo texas2step access lockouts
# access_share_lockouts = false         # true: lockouts, blocks and clears go to [[locations]]
# access_peer_networks = []             # the other servers' addresses, which theirs must come from
# access_lockout_hook = ""              # a program run on each lockout, block and clear here
# internal_networks = []                # e.g. ["10.0.0.0/8", "198.51.100.0/24"]: no code, and
#                                       # only they see History, the API tab and saved results

# --- Traffic limit, for servers whose traffic is billed (docs/traffic.md) ------------------
# traffic_day_gb = 0.0                  # gigabytes (10^9 bytes) tests may move a day; 0 = no limit
# traffic_month_gb = 0.0                # and a month; both begin at midnight in access_timezone
# traffic_counts = "both"               # "sent" (what most clouds bill), "received" or "both"
# traffic_count_internal = true         # false: internal_networks test without counting
# traffic_file = "/var/lib/texas2step/traffic.db"  # sudo texas2step traffic
# traffic_message = "Testing temporarily disabled."  # what refused visitors read
# traffic_url = ""                      # if set, "Click here to continue." links here, such
#                                       # as another texas2step server or the desk's page

# --- Active clients (docs/clients.md) ------------------------------------------------------
# clients_file = "/run/texas2step/clients.db"  # sudo texas2step clients; in memory (tmpfs)
# clients_max = 1000                    # sessions listed, active and the last hour's ended

# --- Server CPU (docs/cpu.md) --------------------------------------------------------------
# cpu_file = "/var/lib/texas2step/cpu.db"  # sudo texas2step cpu; kept 30 days
# cpu_busy_percent = 0                  # refuse new download/upload tests and Video calls
#                                       # while other work uses this % of the host's cores;
#                                       # 0 = never (texas2step and nginx don't count)
# cpu_busy_seconds = 30                 # averaged over this long

# --- Branding and themes -------------------------------------------------------------------
# brand_name = "texas2step"             # header and browser tab
# brand_organization = ""               # shown beside the name and in the footer
# brand_url = ""                        # the organization's website
# brand_logo = ""                       # e.g. "/etc/texas2step/logo.svg" (SVG, PNG, JPEG, WebP)
# brand_notice = ""                     # a line across the top of every page
# brand_footer = ""                     # your footer's text: "\n" starts a line, [label](url) is a link
# default_theme = "system"              # system, light, dark, america, energy, federal, military or texas
# brand_credit = "link"                 # footer's "texas2step <version>": link, text or none
# brand_tagline = "Measurements run in your browser against the selected server"  # "" for none
# header_logo = true                    # the logo left of the name (the star, or brand_logo)
# header_size = true                    # the "Aa" page size; false: everyone gets 100%
# header_theme = true                   # the theme picker; false: everyone gets default_theme
# footer_line = true                    # the bottom line: organization, links, credit, tagline
# Header and footer links: see [[brand_links]] at the end of this file, and your footer's
# own links, beside its text, in [[brand_footer_links]].

# --- Other texas2step servers in the location picker ---------------------------------------
# [[locations]]
# id = "houston"
# name = "houston.example.net"
# url = "https://www.example.org/texas2step"
# location = "Houston, TX"

# --- Links in the header and footer (TOML only) ---------------------------------------------
# [[brand_links]]
# label = "Service desk"
# url = "https://help.example.net"      # https://, http://, mailto: or tel:

# --- Your footer's links, beside brand_footer's text (TOML only) -----------------------------
# [[brand_footer_links]]
# label = "Privacy"
# url = "https://www.example.net/privacy"
