# texas2step settings: /etc/texas2step/config.toml
# Every key is optional; the commented values are the defaults. Any key can also be
# set as an environment variable TEXAS2STEP_<KEY> (upper case).
# After a change: sudo systemctl restart texas2step
# Reference: https://github.com/robert-patrick-texas/texas2step/blob/main/docs/configuration.md

# --- Identity ----------------------------------------------------------------------
# server_id = "local"                   # short id stored with results, e.g. "dallas"
# server_name = "texas2step"            # shown in the header and results
# server_location = ""                  # free text, e.g. "Dallas, TX"
# server_url_v4 = ""                    # IPv4-only base URL (enables the IPv4/IPv6 switch)
# server_url_v6 = ""                    # IPv6-only base URL

# --- Limits --------------------------------------------------------------------------
# max_download_bytes = 1073741824
# max_upload_bytes = 1073741824
# max_stream_seconds = 60.0

# --- UDP probe (WebRTC) ----------------------------------------------------------------
# webrtc_enabled = true
# ice_servers = []                      # e.g. ["stun:stun.example.net:3478"]; none = host candidates only
# max_rtc_sessions = 32                 # per worker
# rtc_session_timeout = 120.0
# rtc_port_min = 0                      # pin the probe's UDP ports so the firewall can
# rtc_port_max = 0                      # allow just that range, e.g. 61000 and 61999

# --- Result history --------------------------------------------------------------------
# results_enabled = true
results_path = "/var/lib/texas2step/results.db"
# results_max_rows = 10000

# --- Server-side measurement (/api/v1/measure/*) ---------------------------------------
# measure_enabled = true
# allow_any_target = false              # true = any URL, not just [[locations]]

# --- Pages of the web UI: hide any, but not all (the API behind them stays) ----------------
# page_test = true                      # the Test tab
# page_monitor = true                   # the Monitor tab
# page_diag = true                      # the Diag tab
# page_history = true                   # the History tab
# page_api = true                       # the API tab

# --- Defaults offered to the browser UI --------------------------------------------------
# default_streams = 4
# default_seconds = 10.0
# default_packets = 500

# --- HTTP ----------------------------------------------------------------------------------
# cors_origins = ["*"]
# trusted_proxies = ["127.0.0.1", "::1"]  # peers whose X-Forwarded-* headers are believed

# --- Logging (journalctl -u texas2step) ----------------------------------------------------
# debug = false                         # true = also every request and WebRTC detail; very verbose

# --- Updates (sudo texas2step update) ------------------------------------------------------
# Where releases are found: GitHub's API for the project, or an internal mirror of it.
# update_url = "https://api.github.com/repos/robert-patrick-texas/texas2step"
# Unattended updates are off until you turn on their timer: docs/install.md (Upgrade).

# --- Access codes, for servers open to the Internet (docs/access.md) -----------------------
# access_code = "off"                   # or how often the code changes: daily, weekly, monthly, fixed
# access_timezone = "America/New_York"  # when daily, weekly and monthly codes change
# access_words = ""                     # your own list, e.g. "/etc/texas2step/access-words.txt"
# access_digits = 2                     # digits at the end of a code: 2, 3 or 4
# access_pass_hours = 12.0              # how long an entered code lets a browser keep testing
# access_key_file = "/etc/texas2step/access.key"  # copy the same key to every server
# access_phrases_file = "/etc/texas2step/access-phrases.toml"  # standing phrases:
#                                       # sudo texas2step access phrase add vip
# internal_networks = []                # e.g. ["10.0.0.0/8", "198.51.100.0/24"]: no code, and
#                                       # only they see History, the API tab and saved results

# --- Branding and themes -------------------------------------------------------------------
# brand_name = "texas2step"             # header and browser tab
# brand_organization = ""               # shown beside the name and in the footer
# brand_url = ""                        # the organization's website
# brand_logo = ""                       # e.g. "/etc/texas2step/logo.svg" (SVG, PNG, JPEG, WebP)
# brand_notice = ""                     # a line across the top of every page
# default_theme = "system"              # system, light, dark, america, energy, federal, military or texas
# brand_credit = "link"                 # footer's "texas2step <version>": link, text or none
# Header and footer links: see [[brand_links]] at the end of this file.

# --- Other texas2step servers in the location picker ---------------------------------------
# [[locations]]
# id = "houston"
# name = "houston.example.net"
# url = "https://www.example.org/texas2step"
# location = "Houston, TX"

# --- Links in the header and footer (TOML only) ---------------------------------------------
# [[brand_links]]
# label = "Service desk"
# url = "https://help.example.net"      # https://, http://, mailto: or tel:
