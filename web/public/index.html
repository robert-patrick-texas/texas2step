<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The server fills these in on every request: the path prefix it is published
         under (e.g. /texas2step/) and its version, from src/texas2step/__init__.py. -->
    <base href="/" />
    <meta name="texas2step-version" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>texas2step</title>
    <meta name="description" content="Throughput, latency, jitter and packet loss between you and this server." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/app.css" />
    <script>
      // Apply the saved theme before first paint.
      try {
        const t = localStorage.getItem("t2s.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="./" data-link aria-label="texas2step home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f5a524" />
              <stop offset=".55" stop-color="#e8467c" />
              <stop offset="1" stop-color="#7c5cff" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#bm)" />
          <path d="M16 6.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z" fill="#fff" />
        </svg>
        <span class="brand-word">texas<em>2</em>step</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a href="./" data-link>Test</a>
        <a href="monitor" data-link>Monitor</a>
        <a href="history" data-link>History</a>
        <a href="api" data-link>API</a>
      </nav>
      <div class="topbar-actions">
        <div class="server-picker" id="server-picker"></div>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme"></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="footer">
      <span id="footer-version">texas2step</span>
      <span class="dot" aria-hidden="true">·</span>
      <a href="api/docs">OpenAPI</a>
      <span class="dot" aria-hidden="true">·</span>
      <span>Measurements run in your browser against the selected server</span>
    </footer>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <noscript><p class="noscript">texas2step needs JavaScript to run measurements.</p></noscript>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
