# texas2step at /texas2step/ on an existing site, e.g. https://www.example.net/texas2step/
#
# Installed as /etc/nginx/snippets/texas2step.conf. Add one line inside the site's
# server { } block, then: sudo nginx -t && sudo systemctl reload nginx
#
#     include snippets/texas2step.conf;
#
# Needs the upstream and map in /etc/nginx/conf.d/texas2step.conf, and the log format in
# /etc/nginx/conf.d/texas2step-log.conf.

# Relative redirects stay right behind TLS-terminating load balancers and odd ports.
location = /texas2step {
    absolute_redirect off;
    return 301 /texas2step/;
}

# ^~ keeps the site's regex locations (static-file rules and the like) from
# claiming texas2step's assets and API.
location ^~ /texas2step/ {
    proxy_pass         http://texas2step/;   # the trailing slash strips /texas2step
    proxy_http_version 1.1;
    proxy_set_header   Host               $host;
    proxy_set_header   Upgrade            $http_upgrade;
    proxy_set_header   Connection         $texas2step_connection;
    # texas2step trusts these from 127.0.0.1 only (trusted_proxies). $remote_addr
    # replaces any X-Forwarded-For the client sent, so it can't spoof its address.
    proxy_set_header   X-Forwarded-For    $remote_addr;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   X-Forwarded-Prefix /texas2step;
    proxy_set_header   X-Client-Protocol  $server_protocol;
    # Both ends of the connection, its TLS and the kernel's TCP RTT, for /api/v1/diag/http.
    proxy_set_header   X-Client-Port      $remote_port;
    proxy_set_header   X-Server-Addr      $server_addr;
    proxy_set_header   X-Server-Port      $server_port;
    proxy_set_header   X-TLS-Protocol     $ssl_protocol;
    proxy_set_header   X-TLS-Cipher       $ssl_cipher;
    proxy_set_header   X-TCP-RTT          $tcpinfo_rtt;
    proxy_set_header   X-TCP-RTTVAR       $tcpinfo_rttvar;

    # Measurement traffic must stream straight through: buffering would absorb
    # uploads and smooth downloads, and the numbers would be wrong.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;
    client_max_body_size    0;
    gzip                    off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Without query strings, which can hold an access pass (conf.d/texas2step-log.conf).
    access_log /var/log/nginx/access.log texas2step;

    # An open Diag tab asks for this once a second, so keep it out of the access log.
    # Everything above applies here too, except proxy_pass.
    location = /texas2step/api/v1/diag/http {
        access_log off;
        proxy_pass http://texas2step/api/v1/diag/http;
    }
}
