# Optional: https://www.example.net/speedtest as a second address for texas2step.
#
# Installed as /etc/nginx/snippets/texas2step-speedtest.conf. Include it next to
# snippets/texas2step.conf in the same server { } block:
#
#     include snippets/texas2step-speedtest.conf;
#
# Visitors are redirected, so links and saved results always use /texas2step/.
# The redirects are temporary (302), so browsers don't remember them if you later
# use /speedtest for something else.

location = /speedtest {
    absolute_redirect off;
    return 302 /texas2step/;
}

location ^~ /speedtest/ {
    absolute_redirect off;
    rewrite ^/speedtest/(.*)$ /texas2step/$1 redirect;
}
