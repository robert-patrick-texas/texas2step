# texas2step: the log format of its nginx snippets.
# Installed as /etc/nginx/conf.d/texas2step-log.conf, which Ubuntu's nginx.conf loads
# inside its http { } block. A file of its own, so that an upgrade brings it even where
# conf.d/texas2step.conf was edited (dpkg keeps an edited file as it is).

# nginx's combined format, with the path in place of the whole request line: the query
# string can hold an access pass (?pass=), which would let anyone who reads the log test
# until it expires.
log_format texas2step '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
