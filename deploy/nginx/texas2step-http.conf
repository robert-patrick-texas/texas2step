# texas2step: http-level definitions for snippets/texas2step.conf.
# Installed as /etc/nginx/conf.d/texas2step.conf, which Ubuntu's nginx.conf loads
# inside its http { } block. On its own it changes nothing.

# The texas2step service; keep in step with LISTEN_HOST/LISTEN_PORT in
# /etc/default/texas2step.
upstream texas2step {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Send "Connection: upgrade" only for WebSocket requests; otherwise keep the
# upstream connection alive.
map $http_upgrade $texas2step_connection {
    default upgrade;
    ""      "";
}
