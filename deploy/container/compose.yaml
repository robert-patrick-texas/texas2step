# texas2step under Docker Compose (docs/container.md). Set the server's details below, then:
#
#     docker compose up -d
#
# Updates: docker compose pull && docker compose up -d
name: texas2step # the volumes are texas2step_etc and texas2step_data, wherever this file is
services:
  texas2step:
    image: ghcr.io/robert-patrick-texas/texas2step:2
    container_name: texas2step
    # The UDP test gives the browser the server's own address, so no NAT: the host's
    # network, or a macvlan network (docs/container.md, Networking).
    network_mode: host
    restart: unless-stopped
    environment:
      TEXAS2STEP_SERVER_ID: houston
      TEXAS2STEP_SERVER_NAME: houston.example.net
      TEXAS2STEP_SERVER_LOCATION: Houston, TX
      # Any other setting in docs/configuration.md, as TEXAS2STEP_<NAME>:
      # TEXAS2STEP_ACCESS_CODE: daily
      # TEXAS2STEP_RTC_PORT_MIN: "61000"
      # TEXAS2STEP_RTC_PORT_MAX: "61999"
      # The container's own (docs/container.md, The container's settings):
      # HTTPS_PORT: "443"
      # HTTP_PORT: "80"
      # HTTP3: "off"
      # TLS_CERT: /etc/letsencrypt/live/houston.example.net/fullchain.pem
      # TLS_KEY: /etc/letsencrypt/live/houston.example.net/privkey.pem
    volumes:
      - etc:/etc/texas2step
      - data:/var/lib/texas2step
      # With TLS_CERT and TLS_KEY above:
      # - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  etc:
  data:
