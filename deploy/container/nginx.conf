# nginx in texas2step's container image (/etc/nginx/nginx.conf there).
#
# The entrypoint writes the site for HTTPS_PORT, HTTP_PORT and HTTP3 into
# /run/texas2step-nginx/ at each start. Files of your own in /etc/texas2step/nginx/*.conf
# are read at the http level, after it: whole server { } blocks, such as the names for
# each HTTP version in docs/install.md. docs/container.md has examples.

user www-data;
worker_processes auto;
worker_rlimit_nofile 65536;
pid /run/nginx.pid;
error_log stderr warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip off;

    # The container's output. snippets/texas2step.conf logs texas2step's own requests with
    # the texas2step format, without query strings, which can hold an access pass.
    access_log /var/log/nginx/access.log;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/conf.d/texas2step-log.conf;
    include /run/texas2step-nginx/*.conf;
    include /etc/texas2step/nginx/*.conf;
}
