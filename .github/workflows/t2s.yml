# t2s, the Go client: its tests on Linux, macOS and Windows, every platform's build, the
# t2s package (built, linted, installed and removed), and a run of it against a real
# texas2step server, whose result must have the Python engine's shape.
name: t2s

on:
  push:
    paths: ["t2s/**", "packaging/t2s/**", "packaging/build-t2s-deb.sh", "tests/methodology-cases.json", "tests/test_t2s.py", ".github/workflows/t2s.yml", ".gitattributes"]
  pull_request:
    paths: ["t2s/**", "packaging/t2s/**", "packaging/build-t2s-deb.sh", "tests/methodology-cases.json", "tests/test_t2s.py", ".github/workflows/t2s.yml", ".gitattributes"]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Actions are pinned by commit, as pypi.yml's are; the comment is its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: t2s/go.mod
          cache-dependency-path: t2s/go.sum

      - name: gofmt, go vet and go test
        working-directory: t2s
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt would change:"; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Build every platform's t2s
        if: runner.os == 'Linux'
        run: make t2s

      - name: Build the t2s package, which lintian must find nothing wrong with
        if: runner.os == 'Linux'
        shell: bash # -e and pipefail, so make t2s-deb failing under tee fails the step
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends lintian
          make t2s-deb | tee "$RUNNER_TEMP/t2s-deb.log"
          # build-t2s-deb.sh prints lintian's findings without failing on them
          if grep -E '^[EW]: ' "$RUNNER_TEMP/t2s-deb.log"; then exit 1; fi
          v=$(make -s version)
          test "$(dpkg-deb -f "dist/t2s_${v}-1_arm64.deb" Architecture)" = arm64

      - name: The t2s package installs, completes, and is removed with nothing left
        if: runner.os == 'Linux'
        shell: bash # -e and pipefail: any check failing fails the step
        run: |
          v=$(make -s version)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q "./dist/t2s_${v}-1_amd64.deb"
          test "$(/usr/bin/t2s version)" = "t2s $v"
          test -f /usr/share/bash-completion/completions/t2s
          test -f /usr/share/man/man1/t2s.1.gz
          test "$(/usr/bin/t2s __complete ' =:' 't2s mo')" = monitor
          /usr/bin/t2s install | grep -q 'came with the t2s package'
          sudo dpkg -V t2s
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q t2s
          test ! -e /usr/bin/t2s
          test ! -e /usr/share/bash-completion/completions/t2s
          test ! -e /usr/share/man/man1/t2s.1.gz
          test ! -e /usr/share/doc/t2s

      - name: The Windows build runs
        if: runner.os == 'Windows'
        working-directory: t2s
        shell: bash
        run: |
          go build -o t2s.exe .
          ./t2s.exe version
          ./t2s.exe run --help

      - name: The macOS build runs
        if: runner.os == 'macOS'
        working-directory: t2s
        env:
          CGO_ENABLED: "0" # as make t2s builds it
        run: |
          go build -o t2s .
          ./t2s version
          ./t2s run --help

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: runner.os == 'Linux'

      - name: t2s against a real server
        if: runner.os == 'Linux'
        run: uv run pytest -q tests/test_t2s.py tests/test_methodology_cases.py
