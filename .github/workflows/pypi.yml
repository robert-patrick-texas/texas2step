# Publish the Python package to PyPI when a GitHub release is published.
#
# A release tagged v<version> (docs/development.md, "Release") builds the sdist and wheel
# from that tag, tests and checks them, and uploads them with PyPI's trusted publishing:
# PyPI trusts this workflow, run in the "pypi" environment, by its OpenID Connect token,
# so no API token is stored anywhere. The upload also carries signed attestations of
# where the files were built.
#
# Run it by hand (Actions → pypi → Run workflow) to rehearse the build and checks on any
# branch; only a published release uploads.
name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned by commit, as this workflow publishes; the comment is its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # a release is built from scratch, not from a shared cache

      - name: Check that the release's tag is the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(make -s version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$TAG" != "v$version" ]; then
            echo "::error::The release's tag is $TAG, but src/texas2step/__init__.py says $version: tag it v$version."
            exit 1
          fi
          echo "texas2step $version"

      - name: Run the tests
        run: uv run pytest -q

      - name: Build the sdist and wheel
        run: uv build --out-dir dist

      - name: Check the metadata PyPI will show
        run: uvx --isolated twine==7.0.0 check --strict dist/*

      - name: Install the wheel on its own, start the server and test it
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TEXAS2STEP_RESULTS_PATH: ${{ runner.temp }}/results.db
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/texas2step-"$VERSION"-py3-none-any.whl
          t2s="$RUNNER_TEMP/smoke/bin/texas2step"
          "$t2s" --version | grep -Fx "texas2step $VERSION"
          "$t2s" serve --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/serve.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/api/v1/health \
            | grep -F "\"version\":\"$VERSION\""
          curl -fsS http://127.0.0.1:8080/ | grep -q 'assets/app.js'
          "$t2s" latency http://127.0.0.1:8080 --count 5

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/texas2step/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # the OpenID Connect token that PyPI's trusted publishing checks
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
